<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" font-family="system-ui, -apple-system, sans-serif"><rect width="240" height="150" fill="#0a1220"/><text x="120" y="13" fill="#fbbf24" font-weight="700" font-size="11" text-anchor="middle">Effective Pop Size</text><rect x="30" y="40" width="180" height="25" fill="#1e3a5f" stroke="#60a5fa"/><text x="120" y="57" fill="#93c5fd" font-size="9" text-anchor="middle" font-weight="700">Census N = 1000</text><line x1="120" y1="67" x2="120" y2="80" stroke="#fbbf24" marker-end="url(#ep1)"/><defs><marker id="ep1" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0,0 6,3 0,6" fill="#fbbf24"/></marker></defs><rect x="70" y="82" width="100" height="25" fill="#4c1d95" stroke="#a78bfa"/><text x="120" y="99" fill="#c4b5fd" font-size="9" text-anchor="middle" font-weight="700">Ne = 100-250</text><text x="120" y="125" fill="#fde68a" font-size="7" text-anchor="middle" font-weight="400">only reproducers count</text><text x="120" y="138" fill="#94a3b8" font-size="7" text-anchor="middle" font-weight="400">Ne = 10-25% of N</text></svg>