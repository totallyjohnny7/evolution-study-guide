<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" font-family="system-ui, -apple-system, sans-serif"><rect width="240" height="150" fill="#0a1220"/><text x="120" y="13" fill="#fbbf24" font-weight="700" font-size="11" text-anchor="middle">Earth's 24-hr Clock</text><circle cx="120" cy="82" r="48" fill="#111827" stroke="#475569" stroke-width="2"/><path d="M 120 82 L 120 34 A 48 48 0 0 1 120.5 34 Z" fill="#ef4444"/><circle cx="120" cy="82" r="3" fill="#fbbf24"/><line x1="120" y1="82" x2="120" y2="40" stroke="#fbbf24" stroke-width="1.5"/><line x1="120" y1="82" x2="158" y2="82" stroke="#93c5fd" stroke-width="1.5"/><text x="120" y="42" fill="#94a3b8" font-size="7" text-anchor="middle" font-weight="400">12</text><text x="162" y="85" fill="#94a3b8" font-size="7" text-anchor="middle" font-weight="400">6</text><text x="78" y="85" fill="#94a3b8" font-size="7" text-anchor="middle" font-weight="400">18</text><text x="120" y="132" fill="#94a3b8" font-size="7" text-anchor="middle" font-weight="400">24</text><text x="190" y="40" fill="#ef4444" font-size="7" text-anchor="end" font-weight="400">humans = last 2 sec</text><line x1="155" y1="42" x2="122" y2="55" stroke="#ef4444" stroke-width="0.8"/><text x="120" y="145" fill="#94a3b8" font-size="9" text-anchor="middle">4.568 bya → now</text></svg>