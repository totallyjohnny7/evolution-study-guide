<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" font-family="system-ui, -apple-system, sans-serif"><rect width="240" height="150" fill="#0a1220"/><text x="120" y="13" fill="#fbbf24" font-weight="700" font-size="11" text-anchor="middle">Topology vs Branch Length</text><g transform="translate(10,30)"><line x1="15" y1="50" x2="35" y2="50" stroke="#60a5fa"/><line x1="35" y1="50" x2="60" y2="25" stroke="#60a5fa"/><line x1="35" y1="50" x2="60" y2="75" stroke="#60a5fa"/><line x1="60" y1="25" x2="95" y2="20" stroke="#60a5fa"/><line x1="60" y1="25" x2="95" y2="35" stroke="#60a5fa"/><text x="55" y="100" fill="#93c5fd" font-size="7" text-anchor="middle">same topology</text></g><g transform="translate(130,30)"><line x1="5" y1="50" x2="15" y2="50" stroke="#22c55e"/><line x1="15" y1="50" x2="30" y2="25" stroke="#22c55e"/><line x1="15" y1="50" x2="55" y2="75" stroke="#22c55e"/><line x1="30" y1="25" x2="95" y2="15" stroke="#22c55e"/><line x1="30" y1="25" x2="60" y2="40" stroke="#22c55e"/><text x="55" y="100" fill="#86efac" font-size="7" text-anchor="middle">diff lengths</text></g><text x="120" y="145" fill="#94a3b8" font-size="9" text-anchor="middle">branch length = time/change</text></svg>