<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" font-family="system-ui, -apple-system, sans-serif"><rect width="240" height="150" fill="#0a1220"/><text x="120" y="13" fill="#fbbf24" font-weight="700" font-size="11" text-anchor="middle">Nesse's 6 Reasons</text><polygon points="60,36 72,43 72,57 60,64 48,57 48,43" fill="#1f2937" stroke="#ef4444" stroke-width="1.2"/><text x="60" y="48" fill="#ef4444" font-size="6" text-anchor="middle" font-weight="700">pathogens</text><text x="60" y="56" fill="#94a3b8" font-size="5" text-anchor="middle">evolve fast</text><polygon points="120,36 132,43 132,57 120,64 108,57 108,43" fill="#1f2937" stroke="#fbbf24" stroke-width="1.2"/><text x="120" y="48" fill="#fbbf24" font-size="6" text-anchor="middle" font-weight="700">mismatch</text><text x="120" y="56" fill="#94a3b8" font-size="5" text-anchor="middle">env change</text><polygon points="180,36 192,43 192,57 180,64 168,57 168,43" fill="#1f2937" stroke="#a78bfa" stroke-width="1.2"/><text x="180" y="48" fill="#a78bfa" font-size="6" text-anchor="middle" font-weight="700">trade-off</text><text x="180" y="56" fill="#94a3b8" font-size="5" text-anchor="middle">cost/benefit</text><polygon points="60,86 72,93 72,107 60,114 48,107 48,93" fill="#1f2937" stroke="#60a5fa" stroke-width="1.2"/><text x="60" y="98" fill="#60a5fa" font-size="6" text-anchor="middle" font-weight="700">constraint</text><text x="60" y="106" fill="#94a3b8" font-size="5" text-anchor="middle">no redesign</text><polygon points="120,86 132,93 132,107 120,114 108,107 108,93" fill="#1f2937" stroke="#22c55e" stroke-width="1.2"/><text x="120" y="98" fill="#22c55e" font-size="6" text-anchor="middle" font-weight="700">pleiotropy</text><text x="120" y="106" fill="#94a3b8" font-size="5" text-anchor="middle">1 gene many</text><polygon points="180,86 192,93 192,107 180,114 168,107 168,93" fill="#1f2937" stroke="#ec4899" stroke-width="1.2"/><text x="180" y="98" fill="#ec4899" font-size="6" text-anchor="middle" font-weight="700">defense</text><text x="180" y="106" fill="#94a3b8" font-size="5" text-anchor="middle">fever/pain</text><text x="120" y="140" fill="#94a3b8" font-size="9" text-anchor="middle">why we get sick</text></svg>