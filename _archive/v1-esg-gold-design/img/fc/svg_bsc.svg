<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" font-family="system-ui, -apple-system, sans-serif"><rect width="240" height="150" fill="#0a1220"/><text x="120" y="13" fill="#fbbf24" font-weight="700" font-size="11" text-anchor="middle">Biological Species Concept</text><rect x="20" y="30" width="200" height="30" fill="#1f2937" stroke="#fbbf24"/><text x="120" y="50" fill="#fde68a" font-size="9" text-anchor="middle" font-weight="400">Can they produce FERTILE offspring?</text><line x1="120" y1="60" x2="70" y2="80" stroke="#22c55e" stroke-width="1.5" marker-end="url(#bs1)"/><line x1="120" y1="60" x2="170" y2="80" stroke="#ef4444" stroke-width="1.5" marker-end="url(#bs1)"/><defs><marker id="bs1" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0,0 6,3 0,6" fill="#fbbf24"/></marker></defs><text x="70" y="75" fill="#22c55e" font-size="9" text-anchor="middle" font-weight="700">YES</text><rect x="30" y="85" width="80" height="40" fill="#064e3b" stroke="#22c55e"/><text x="70" y="102" fill="#86efac" font-size="9" text-anchor="middle" font-weight="700">SAME</text><text x="70" y="115" fill="#86efac" font-size="8" text-anchor="middle" font-weight="400">species</text><text x="170" y="75" fill="#ef4444" font-size="9" text-anchor="middle" font-weight="700">NO</text><rect x="130" y="85" width="80" height="40" fill="#7f1d1d" stroke="#ef4444"/><text x="170" y="102" fill="#fca5a5" font-size="9" text-anchor="middle" font-weight="700">DIFFERENT</text><text x="170" y="115" fill="#fca5a5" font-size="8" text-anchor="middle" font-weight="400">species</text></svg>