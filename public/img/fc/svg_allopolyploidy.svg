<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" font-family="system-ui, -apple-system, sans-serif"><rect width="240" height="150" fill="#0a1220"/><text x="120" y="13" fill="#fbbf24" font-weight="700" font-size="11" text-anchor="middle">Allopolyploidy</text><rect x="10" y="30" width="50" height="25" fill="#1e3a5f" stroke="#60a5fa"/><text x="35" y="46" fill="#93c5fd" font-size="7" text-anchor="middle" font-weight="400">A (2n=4)</text><text x="70" y="46" fill="#fbbf24" font-size="11">x</text><rect x="80" y="30" width="50" height="25" fill="#4c1d95" stroke="#a78bfa"/><text x="105" y="46" fill="#c4b5fd" font-size="7" text-anchor="middle" font-weight="400">B (2n=6)</text><line x1="70" y1="60" x2="70" y2="70" stroke="#fbbf24" marker-end="url(#ap1)"/><defs><marker id="ap1" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0,0 6,3 0,6" fill="#fbbf24"/></marker></defs><rect x="25" y="72" width="90" height="22" fill="#7f1d1d" stroke="#ef4444"/><text x="70" y="87" fill="#fca5a5" font-size="7" text-anchor="middle" font-weight="400">sterile hybrid (n=5)</text><line x1="140" y1="85" x2="160" y2="85" stroke="#fbbf24" marker-end="url(#ap1)"/><text x="150" y="78" fill="#fbbf24" font-size="7" text-anchor="middle" font-weight="400">2x</text><rect x="165" y="72" width="70" height="22" fill="#064e3b" stroke="#22c55e"/><text x="200" y="87" fill="#86efac" font-size="7" text-anchor="middle" font-weight="400">fertile 2n=10</text><text x="120" y="115" fill="#fde68a" font-size="7" text-anchor="middle" font-weight="400">chromosome doubling -> new species</text></svg>