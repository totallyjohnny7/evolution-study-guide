<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" font-family="system-ui, -apple-system, sans-serif"><rect width="240" height="150" fill="#0a1220"/><text x="120" y="13" fill="#fbbf24" font-weight="700" font-size="11" text-anchor="middle">p53 Pleiotropy</text><rect x="20" y="40" width="200" height="18" fill="#1f2937" stroke="#fbbf24"/><text x="120" y="53" fill="#fde68a" font-size="9" text-anchor="middle" font-weight="700">p53 gene</text><line x1="60" y1="60" x2="60" y2="75" stroke="#22c55e" marker-end="url(#p5)"/><line x1="180" y1="60" x2="180" y2="75" stroke="#ef4444" marker-end="url(#p5)"/><defs><marker id="p5" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><polygon points="0,0 5,2.5 0,5" fill="#fbbf24"/></marker></defs><rect x="25" y="78" width="75" height="35" fill="#064e3b" stroke="#22c55e"/><text x="62" y="93" fill="#86efac" font-size="8" text-anchor="middle" font-weight="700">young adult</text><text x="62" y="106" fill="#86efac" font-size="7" text-anchor="middle" font-weight="400">suppress tumors</text><rect x="140" y="78" width="75" height="35" fill="#7f1d1d" stroke="#ef4444"/><text x="177" y="93" fill="#fca5a5" font-size="8" text-anchor="middle" font-weight="700">old adult</text><text x="177" y="106" fill="#fca5a5" font-size="7" text-anchor="middle" font-weight="400">senescence</text><text x="120" y="145" fill="#94a3b8" font-size="9" text-anchor="middle">same gene, opposite roles</text></svg>