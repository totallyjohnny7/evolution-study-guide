<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" font-family="system-ui, -apple-system, sans-serif"><rect width="240" height="150" fill="#0a1220"/><text x="120" y="13" fill="#fbbf24" font-weight="700" font-size="11" text-anchor="middle">50/500 Rule</text><line x1="20" y1="90" x2="225" y2="90" stroke="#475569"/><line x1="50" y1="88" x2="50" y2="92" stroke="#94a3b8"/><line x1="100" y1="88" x2="100" y2="92" stroke="#94a3b8"/><line x1="150" y1="88" x2="150" y2="92" stroke="#94a3b8"/><line x1="200" y1="88" x2="200" y2="92" stroke="#94a3b8"/><text x="14" y="94" fill="#93c5fd" font-size="8" text-anchor="middle" font-weight="400">Ne</text><text x="50" y="105" fill="#94a3b8" font-size="7" text-anchor="middle" font-weight="400">10</text><text x="100" y="105" fill="#94a3b8" font-size="7" text-anchor="middle" font-weight="400">100</text><text x="200" y="105" fill="#94a3b8" font-size="7" text-anchor="middle" font-weight="400">1000</text><line x1="80" y1="40" x2="80" y2="90" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,2"/><text x="80" y="32" fill="#fbbf24" font-size="8" text-anchor="middle" font-weight="700">Ne=50</text><text x="80" y="55" fill="#fde68a" font-size="7" text-anchor="middle" font-weight="400">(short-term)</text><text x="80" y="68" fill="#94a3b8" font-size="6" text-anchor="middle" font-weight="400">avoid inbreeding</text><line x1="180" y1="40" x2="180" y2="90" stroke="#22c55e" stroke-width="2" stroke-dasharray="3,2"/><text x="180" y="32" fill="#22c55e" font-size="8" text-anchor="middle" font-weight="700">Ne=500</text><text x="180" y="55" fill="#86efac" font-size="7" text-anchor="middle" font-weight="400">(long-term)</text><text x="180" y="68" fill="#94a3b8" font-size="6" text-anchor="middle" font-weight="400">adaptive</text><text x="120" y="130" fill="#94a3b8" font-size="9" text-anchor="middle">Franklin thresholds</text></svg>